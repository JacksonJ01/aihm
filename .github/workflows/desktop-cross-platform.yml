name: Desktop cross-platform packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        default: 0.1.1
      release_tag:
        description: Existing GitHub release tag to receive the packages
        required: true
        default: desktop-v0.1.1

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ inputs.release_tag }}

concurrency:
  group: desktop-release-${{ inputs.release_tag }}

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel x64
            os: macos-15-intel
            platform: macOS
            architecture: x64
            media_pipe: 0.10.21
            script: mainApp/AI Humo EXE pipeline/macOS/build_portable.sh
          - name: macOS Apple Silicon arm64
            os: macos-15
            platform: macOS
            architecture: arm64
            media_pipe: 1.2.2
            script: mainApp/AI Humo EXE pipeline/macOS/build_portable.sh
          - name: Linux x64
            os: ubuntu-22.04
            platform: Linux
            architecture: x64
            media_pipe: 1.2.2
            script: mainApp/AI Humo EXE pipeline/Linux/build_portable.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mainApp/AI Humo EXE pipeline/requirements-build-unix.txt

      - name: Install Linux GUI runtime libraries
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 xvfb

      - name: Install packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "mainApp/AI Humo EXE pipeline/requirements-build-unix.txt"
          python -m pip install "mediapipe==${{ matrix.media_pipe }}"
          python -m pip check

      - name: Smoke-test source imports
        shell: bash
        env:
          PYTHONPATH: mainApp:mainApp/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import cv2, mediapipe, pyarrow; from app.AIHuMoDataStudio import HomeWindow; print('source imports passed')"

      - name: Fetch and verify the bundled pose model
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import urlopen

          url = ("https://storage.googleapis.com/mediapipe-models/pose_landmarker/"
                 "pose_landmarker_full/float16/1/pose_landmarker_full.task")
          with urlopen(url, timeout=60) as response:
              model = response.read()
          assert sha256(model).hexdigest() == "4eaa5eb7a98365221087693fcc286334cf0858e2eb6e15b506aa4a7ecdcec4ad"
          path = Path("mainApp/full_model/pose_landmarker_full.task")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(model)
          PY

      - name: Build native package
        shell: bash
        run: bash "${{ matrix.script }}" "$PACKAGE_VERSION"

      - name: Smoke-test frozen Linux launcher
        if: matrix.platform == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 20s xvfb-run -a "mainApp/AI Humo EXE pipeline/Linux/dist/v${PACKAGE_VERSION}-x64/AIHuMo Data Studio/AIHuMo Data Studio" || status=$?
          test "${status:-0}" -eq 124

      - name: Smoke-test frozen macOS launcher
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app="mainApp/AI Humo EXE pipeline/macOS/dist/v${PACKAGE_VERSION}-$(uname -m)/AIHuMo Data Studio.app"
          executable="$app/Contents/MacOS/AIHuMo Data Studio"
          "$executable" & pid=$!
          sleep 15
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" 2>/dev/null || true

      - name: Verify package checksums
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "Linux" ]]; then
            cd "mainApp/AI Humo EXE pipeline/Linux/release"
            sha256sum -c *.sha256
          else
            cd "mainApp/AI Humo EXE pipeline/macOS/release"
            shasum -a 256 -c *.sha256
          fi

      - name: Upload workflow package
        uses: actions/upload-artifact@v4
        with:
          name: aihumo-${{ matrix.platform }}-${{ matrix.architecture }}-v${{ inputs.version }}
          path: mainApp/AI Humo EXE pipeline/${{ matrix.platform }}/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach packages to release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: aihumo-*-v${{ inputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Confirm target release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" == "desktop-v$PACKAGE_VERSION" ]]
          gh release view "$RELEASE_TAG"

      - name: Publish native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/*
