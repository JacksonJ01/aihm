name: Desktop cross-platform packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the leading v
        required: true
        default: 0.1.3
      release_tag:
        description: GitHub release tag to create or update
        required: true
        default: desktop-v0.1.3
  push:
    tags:
      - desktop-v*

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref_name }}

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Resolve and validate version and tag
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
            version="${tag#desktop-v}"
          fi

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$tag" == "desktop-v$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel x64
            os: macos-15-intel
            platform: macOS
            architecture: x64
            media_pipe: 0.10.21
            script: mainApp/AI Humo EXE pipeline/macOS/build_portable.sh
          - name: macOS Apple Silicon arm64
            os: macos-15
            platform: macOS
            architecture: arm64
            media_pipe: 1.2.2
            script: mainApp/AI Humo EXE pipeline/macOS/build_portable.sh
          - name: Linux x64
            os: ubuntu-22.04
            platform: Linux
            architecture: x64
            media_pipe: 1.2.2
            script: mainApp/AI Humo EXE pipeline/Linux/build_portable.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mainApp/AI Humo EXE pipeline/requirements-build-unix.txt

      - name: Install Linux GUI runtime libraries
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 xvfb

      - name: Install packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "mainApp/AI Humo EXE pipeline/requirements-build-unix.txt"
          python -m pip install "mediapipe==${{ matrix.media_pipe }}"
          python -m pip check

      - name: Smoke-test source imports
        shell: bash
        env:
          PYTHONPATH: mainApp:mainApp/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import cv2, mediapipe, pyarrow; from app.AIHuMoDataStudio import HomeWindow; print('source imports passed')"

      - name: Fetch and verify the bundled pose model
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import urlopen

          url = ("https://storage.googleapis.com/mediapipe-models/pose_landmarker/"
                 "pose_landmarker_full/float16/1/pose_landmarker_full.task")
          with urlopen(url, timeout=60) as response:
              model = response.read()
          assert sha256(model).hexdigest() == "5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1"
          path = Path("mainApp/full_model/pose_landmarker_full.task")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(model)
          PY

      - name: Build native package
        shell: bash
        run: bash "${{ matrix.script }}" "$PACKAGE_VERSION"

      - name: Smoke-test frozen Linux launcher
        if: matrix.platform == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          xvfb-run -a "mainApp/AI Humo EXE pipeline/Linux/dist/v${PACKAGE_VERSION}-x64/AIHuMo Data Studio/AIHuMo Data Studio" --smoke-test

      - name: Smoke-test frozen macOS launcher
        if: matrix.platform == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app="mainApp/AI Humo EXE pipeline/macOS/dist/v${PACKAGE_VERSION}-$(uname -m)/AIHuMo Data Studio.app"
          executable="$app/Contents/MacOS/AIHuMo Data Studio"
          "$executable" --smoke-test

      - name: Verify package checksums
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "Linux" ]]; then
            cd "mainApp/AI Humo EXE pipeline/Linux/release"
            sha256sum -c *.sha256
          else
            cd "mainApp/AI Humo EXE pipeline/macOS/release"
            shasum -a 256 -c *.sha256
          fi

      - name: Upload workflow package
        uses: actions/upload-artifact@v4
        with:
          name: aihumo-${{ matrix.platform }}-${{ matrix.architecture }}-v${{ needs.prepare.outputs.version }}
          path: mainApp/AI Humo EXE pipeline/${{ matrix.platform }}/release/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mainApp/AI Humo EXE pipeline/requirements-build-unix.txt

      - name: Create isolated build environment
        shell: pwsh
        run: |
          python -m venv mainApp/.venv
          & mainApp/.venv/Scripts/python.exe -m pip install --upgrade pip
          & mainApp/.venv/Scripts/python.exe -m pip install -r "mainApp/AI Humo EXE pipeline/requirements-build-unix.txt"
          & mainApp/.venv/Scripts/python.exe -m pip install "mediapipe==0.10.21"
          & mainApp/.venv/Scripts/python.exe -m pip check

      - name: Fetch and verify the bundled pose model
        shell: pwsh
        run: |
          $model = "mainApp/full_model/pose_landmarker_full.task"
          New-Item -ItemType Directory -Force -Path (Split-Path $model) | Out-Null
          Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task" -OutFile $model
          $actual = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1") { throw "Pose model checksum mismatch: $actual" }

      - name: Smoke-test source imports
        shell: pwsh
        env:
          PYTHONPATH: mainApp;mainApp/src
          QT_QPA_PLATFORM: offscreen
        run: '& mainApp/.venv/Scripts/python.exe mainApp/main.py --smoke-test'

      - name: Build native package
        shell: pwsh
        run: '& "mainApp/AI Humo EXE pipeline/Windows/build_portable.ps1" -Version $env:PACKAGE_VERSION'

      - name: Smoke-test frozen launcher
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "mainApp/AI Humo EXE pipeline/dist/v$env:PACKAGE_VERSION/AIHuMo Data Studio/AIHuMo Data Studio.exe"
          & mainApp/.venv/Scripts/python.exe -c "import subprocess; subprocess.run([r'$exe', '--smoke-test'], check=True, timeout=60)"

      - name: Verify package checksum
        shell: pwsh
        run: |
          $zip = "mainApp/AI Humo EXE pipeline/release/AIHuMo-Data-Studio-Windows-v$env:PACKAGE_VERSION.zip"
          $expected = (Get-Content "$zip.sha256").Split()[0]
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Package checksum mismatch" }

      - name: Upload workflow package
        uses: actions/upload-artifact@v4
        with:
          name: aihumo-Windows-x64-v${{ needs.prepare.outputs.version }}
          path: mainApp/AI Humo EXE pipeline/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach packages to release
    needs: [prepare, build, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download native packages
        uses: actions/download-artifact@v4
        with:
          pattern: aihumo-*-v${{ needs.prepare.outputs.version }}
          path: release-assets
          merge-multiple: true

      - name: Create or confirm target release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" == "desktop-v$PACKAGE_VERSION" ]]
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "AIHuMo Data Studio v$PACKAGE_VERSION" \
            --generate-notes

      - name: Publish native packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
