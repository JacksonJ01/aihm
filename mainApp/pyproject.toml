[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aihumo-pipeline"
version = "0.4.0"
description = "AIHuMo modular exercise computer-vision data pipeline and annotation studio"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "opencv-python>=4.8",
  "mediapipe>=0.10",
  "PyQt6>=6.7",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "torch>=2.3",
  "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]
